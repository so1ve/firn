[package]
name = "firn"
version = "0.1.0"
edition = "2024"
description = "Stateful Nix binary cache backed by GHCR"
repository = "https://github.com/so1ve/firn"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hmac = "0.13"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
zstd = "0.13"

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
default_trait_access = "warn"
disallowed_methods = "warn"
enum_glob_use = "warn"
fn_params_excessive_bools = "warn"
format_collect = "warn"
format_push_string = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
missing_const_for_fn = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
new_without_default = "allow"
redundant_pub_crate = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
struct_excessive_bools = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnecessary_literal_bound = "warn"
use_self = "warn"
verbose_file_reads = "warn"
wildcard_imports = "warn"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
